id: devtalk-english
name: DevTalk English
niche: English shadowing material for developers — real dev stories in natural spoken English

hosts:
  - name: Alex
    voice: M4
    personality: male developer, honest, slightly self-deprecating, tells personal stories with concrete details, speaks B1-B2 naturally with light dev vocabulary
  - name: Mia
    voice: F4
    personality: female supportive listener, asks short curious questions, paraphrases simply (A2-B1), never lectures — reacts like a friend hearing the story for the first time

script:
  targetMinWords: 1100
  targetMinLines: 62
  languageLevel: B1-B2 (Alex) / A2-B1 (Mia reactions)
  closingTemplate: "Thanks for listening — see you next time on {channelName}!"
  dialogueRules: |
    - HYBRID FORMAT: Alex is the main storyteller (~75–85% of lines); Mia reacts briefly (~15–25%)
    - Alex speaks at B1-B2 — natural spoken English with light dev vocabulary (bug, deploy, API, code review)
    - Mia speaks at A2-B1 when she reacts — short questions, empathy, simple paraphrases; never lectures
    - Only Alex and Mia speak — no narrator
    - Alex MAY speak 3–6 consecutive lines when telling a story — do NOT interrupt him mid-story
    - Mia gets 1–3 lines per section — curious "wait, really?", supportive reactions, or a simpler restatement
    - Do NOT force ping-pong Q&A — this is mostly Alex's monologue with Mia as a warm listener
    - Each line: 1–2 sentences (~14–20 words per line)
    - Sound human, not AI: use specific details — avoid generic motivational phrases
    - Do NOT include IPA — text only
  dialogueFlowExample: |
    Hybrid flow — BAD (too much back-and-forth):
    Alex: "So I decided to start a YouTube channel in English."
    Mia: "That's brave! What made you think of that?"
    Alex: "Well, I wanted to practice speaking."
    Mia: "And were you fluent already?"
    Alex: "No, not at all actually."

    Hybrid flow — GOOD (greeting + Alex tells, Mia reacts briefly):
    Mia: "Hey everyone, welcome back to DevTalk English!"
    Alex: "So I decided to start a YouTube channel in English — even though my English wasn't fluent."
    Alex: "I kept telling myself I had to wait until I sounded perfect."
    Alex: "But every month I waited, I just got more afraid to hit record."
    Mia: "So you were scared people would judge your English?"
    Alex: "Exactly. I thought one mistake on camera would prove I wasn't good enough."
    Alex: "Then I realized — waiting for perfect English was the thing keeping me stuck."
  sections:
    - id: intro
      label: Intro & hook
      lineCount: 11
      brief: Mia opens with a brief warm greeting (welcome to DevTalk English, hello everyone). Alex then launches into a personal hook about the topic — why this matters to devs learning English. Mia asks ONE short curious question near the end. Set up the episode as a real story, not a lesson.
    - id: main1
      label: The decision
      lineCount: 14
      brief: Alex tells the origin story — the moment he decided to start creating content in English despite not being fluent. Concrete details (what he was doing, what he felt). Mia reacts 1–2 times with empathy or a simple paraphrase.
    - id: main2
      label: The fear
      lineCount: 14
      brief: Alex names the biggest fear or misconception ("I need to be fluent first", "people will laugh at my accent"). Push back with a real example from his experience. Mia asks ONE "wait, really?" moment.
    - id: main3
      label: What changed
      lineCount: 14
      brief: Alex shares what actually helped — shadowing, imperfect practice, small wins. One actionable tip listeners can try this week. Mia restates the key idea in simpler English (A2-B1).
    - id: closing
      label: Closing
      lineCount: 11
      brief: Alex recaps the three main points in his own words and lands one clear takeaway. Mia gives a warm one-line reaction. End with a brief goodbye and "see you next time on DevTalk English" — mention Speak English With Energy as the main learning channel. Do NOT ask viewers to like, share, or subscribe.

short:
  enabled: false
  hookSpeaker: Alex
  bodySpeaker: Mia
  minLines: 5
  maxLines: 12

perEpisodeBackground: true

