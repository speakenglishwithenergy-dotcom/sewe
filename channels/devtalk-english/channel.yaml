    templateType: overlay-template
    brandColors: "Dark Teal #0a2e2e, Cyan Teal #14B8A6, White #FFFFFF, Dark Navy #0D1B3D, Yellow accent for emphasis"
    charactersBlock: |
      - Alex (thumbnail only): young Asian male developer, glasses, black hoodie, positioned on RIGHT ~35% of frame
    logoLockRules: "LOGO AND BADGE ARE LOCKED ASSETS: copy them pixel-for-pixel from the reference image. Never redraw, regenerate, or reinterpret any logo icon or badge icon."
    logoUnchanged: |
      BOTTOM LEFT — DevTalk logo block (ABSOLUTELY UNTOUCHED — copy verbatim from reference):
      - CRITICAL: Do NOT generate, redraw, reinterpret, or replace the speech-bubble logo icon
      - Speech bubble with </> code symbol and sound wave
      - "DevTalk" wordmark in white bold sans-serif
      - "— ENGLISH —" subtitle in teal
      - Same size, position, spacing, colors, and fonts as reference — ZERO changes
    badgeUnchanged: |
      BOTTOM CENTER — category badge row (ABSOLUTELY UNTOUCHED — copy verbatim from reference):
      - CRITICAL: Do NOT regenerate any badge icons — use the reference graphic exactly
      - Four white icons with labels: PROGRAMMING (</>), ENGLISH PRACTICE (mic), CAREER GROWTH (cloud), BUILDING MY FUTURE (rocket)
      - Thin white vertical dividers between icons
      - Same size, position, spacing, colors, and fonts as reference — ZERO changes
    backgroundUnchanged: |
      TOP LEFT — logo + episode tag block (ABSOLUTELY UNTOUCHED — copy verbatim from reference):
      - DevTalk logo (speech bubble with </> and sound wave, wordmark, — ENGLISH —)
      - Teal brush-stroke "EPISODE N" tag with hand-drawn white arrow and action lines
      BOTTOM LEFT — category badge row (same four icons as thumbnail)
      BOTTOM — semi-transparent dark rounded bar with centered placeholder dots
    titleChangeBlock: |
      TOP RIGHT — teal brush-stroke title banner (CHANGE text only):
      - Keep exact brush-stroke shape, glow, and dark sans-serif typography from reference
      - Replace only the title text with the episode title
      - Parenthetical emphasis may use yellow-green accent like the reference
    shortLogoUnchanged: |
      TOP — logo block (ABSOLUTELY UNTOUCHED — copy verbatim from reference):
      - CRITICAL: Do NOT generate, redraw, reinterpret, or replace ANY logo icons
      - Same wordmark layout, colors, spacing, and compact vertical sizing as reference — ZERO changes
    shortBadgeUnchanged: |
      BOTTOM — badge block (ABSOLUTELY UNTOUCHED — copy verbatim from reference):
      - CRITICAL: Do NOT regenerate badge icons — use the reference graphic exactly
      - Same size, position, spacing, colors, and fonts as reference — ZERO changes
    artStyle: "blurred photorealistic dev workspace, moody teal/navy lighting, shallow depth of field (bokeh), graphic overlays on photo"
    topicRelevance: |
      TOPIC RELEVANCE — REQUIRED for every change you make:
      - Episode topic drives the blurred workspace photo — desk setup, monitors, props, lighting
      - Pick a specific dev scene tied to the topic (code on screen, notebook, whiteboard, late-night coding, etc.)
      - Keep heavy background blur so overlays and subtitles stay readable
      - Teal/navy color grade consistent across episodes
      - AVOID: random props or generic office photos with no link to the topic
    expressionModeration: |
      EXPRESSION INTENSITY — warm and clear at thumbnail size, but natural and moderate:
      - Subtle-to-medium expressiveness — like a real dev vlog moment, not a cartoon reaction shot
      - NOT over-the-top, NOT exaggerated YouTube-face, NOT clownish or melodramatic
    charactersExpressionGuidance: |
      Alex (thumbnail only) — pick ONE clear, moderate expression/pose that fits THIS episode's topic and hook.
      Examples: hand-on-chin thinking, looking up while explaining, confident presenter glance.
      AVOID: exaggerated shock, jaw-drop, or passive blank stare.

