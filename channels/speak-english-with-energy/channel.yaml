    shortLogoUnchanged: |
      TOP — "Speak ENGLISH WITH ENERGY" logo block (ABSOLUTELY UNTOUCHED — copy verbatim from reference):
      - CRITICAL: Do NOT generate, redraw, reinterpret, or replace ANY logo icons
      - Microphone icon and open book icon MUST match the reference exactly
      - Same wordmark layout, colors, spacing, and compact vertical sizing as reference — ZERO changes
    shortBadgeUnchanged: |
      BOTTOM — green rounded badge block (ABSOLUTELY UNTOUCHED — copy verbatim from reference):
      - CRITICAL: Do NOT regenerate the microphone icon inside the badge — use the reference graphic exactly
      - Green rounded badge with microphone icon — "ENGLISH PODCAST" and "FOR LEARNING ENGLISH"
      - Same size, position, spacing, colors, and fonts as reference — ZERO changes
    artStyle: "modern clean digital illustration, warm beige studio, soft shading, not photorealistic"
    characterColorReference: |
      CHARACTER COLORS — must match the landscape podcast thumbnail reference exactly:
      - Victor sweater: forest green / olive green — NEVER navy, black, or dark blue
      - Lisa sweater: bright orange #FF7A00
    topicRelevance: |
      TOPIC RELEVANCE — REQUIRED for every change you make:
      - Episode topic drives ALL creative choices — expressions, gestures, props, visual metaphors, book spines
      - Pick expressions that fit THIS episode's specific problem or insight
      - Props and desk objects must clearly symbolize the topic
      - AVOID: random props, generic emotions, decorative objects with no link to the topic
    expressionModeration: |
      EXPRESSION INTENSITY — warm and clear at thumbnail size, but natural and moderate:
      - Subtle-to-medium expressiveness — like a real podcast moment, not a cartoon reaction shot
      - NOT over-the-top, NOT exaggerated YouTube-face, NOT clownish or melodramatic
    charactersExpressionGuidance: |
      Victor's expression — pick ONE clear, moderate reaction that fits THIS episode's topic and hook.
      Lisa's expression — pick ONE clear, moderate coaching reaction that pairs with Victor's topic moment.
      AVOID: exaggerated shock, jaw-drop, always pointing at Victor, passive listener pose.

