id: speak-english-with-energy
name: Speak English With Energy
niche: English learning podcast for A2-B1 learners

hosts:
  - name: Victor
    voice: M1
    personality: male, warm, enthusiastic, uses real-life examples, encouraging
  - name: Lisa
    voice: F1
    personality: female, thoughtful, asks insightful questions, relatable, practical

script:
  targetMinWords: 1100
  targetMinLines: 62
  languageLevel: A2-B1
  closingTemplate: "Thanks for listening — see you next time on {channelName}!"
  dialogueRules: |
    - English level: A2-B1 (clear vocabulary, common expressions)
    - Only configured hosts speak — no narrator
    - Natural spoken English — sound like friends on a real podcast, not a scripted interview
    - Each line: 1–2 sentences (~14–20 words per line) — conversational, not one-liners
    - Keep momentum: every line should move the conversation forward
    - Turn-taking is flexible: the same host MAY speak 2–4 consecutive lines when finishing a story
    - When telling a story, let the storyteller finish it across consecutive lines
    - Do NOT end a line with a dangling hook just to hand off the turn
    - Questions should react to what was actually said, not mechanically prompt the next beat
    - Avoid stiff ping-pong Q&A; mix reactions, follow-ups, and back-and-forth naturally
    - Sound human, not AI: use specific details — avoid generic motivational phrases
    - Do NOT include IPA — text only
  dialogueFlowExample: |
    Story flow — BAD (forced hand-off):
    Victor: "Well, I remember a time in school where I spoke up in class, right?"
    Lisa: "And did something happen that made you feel embarrassed?"
    Victor: "Yeah, a few classmates laughed, and it really got to me."

    Story flow — GOOD (storyteller continues naturally):
    Victor: "Well, I remember a time in school where I spoke up in class."
    Victor: "A few classmates laughed, and honestly, it really got to me."
    Lisa: "Oh, that hurts — did it change how you spoke up after that?"
  sections:
    - id: intro
      label: Intro & hook
      lineCount: 11
      brief: Warm greeting, introduce the topic, paint a quick everyday scene listeners recognize, explain why it matters to English learners today.
    - id: main1
      label: Main idea 1
      lineCount: 14
      brief: Core concept of the topic. Victor tells a personal story with concrete details — he may speak 2–4 lines in a row to finish it before Lisa reacts.
    - id: main2
      label: Main idea 2
      lineCount: 14
      brief: Second angle with a specific everyday example. Name one misconception, correct it, and let the hosts react with a follow-up or "what if" moment.
    - id: main3
      label: Main idea 3
      lineCount: 14
      brief: Practical tips and one common mistake — what listeners can try this week. Walk through one tip step by step; stay actionable, not repetitive.
    - id: closing
      label: Closing
      lineCount: 11
      brief: Finish the conversation first — recap the three main points in your own words, land one clear actionable tip, and let Victor and Lisa react naturally. Only after that wrap-up, end with a brief warm goodbye and "see you next time" — do NOT ask viewers to like, share, or subscribe.

