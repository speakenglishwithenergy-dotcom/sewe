    background: "#0D1B3D"
  shortSubtitleStyle:
    fontSize: 64
    hookFontSize: 80
    marginV: 260
    lineWidth: 32
    useBox: true
    hookUseBox: true
    boxPadding: 28
    hookBoxPadding: 32
    outline: "#0D1B3D"
    outlineWidth: 8
    shadow: 8
  waveVisualizer:
    y: 200
  thumbnail:
    freshnessMode: fresh-episode
    brandColors: "Dark Navy #0D1B3D, Royal Blue #1E3A8A, Bright Orange #FF7A00, Off-white #F2F4F7"
    charactersBlock: |
      BOTH HOSTS REQUIRED — match the reference illustration style exactly:
      - Victor: male, brown hair, short beard, forest green / olive green sweater (NOT navy/black), black headphones, navy mug labeled "Victor"
      - Lisa: female, long wavy brown hair, bright orange #FF7A00 sweater, black headphones, orange mug labeled "Lisa"
      - Same flat digital-illustration faces/bodies as the reference — NEVER photorealistic, NEVER 3D/Pixar, NEVER anime
    logoLockRules: "LOGO IS A LOCKED ASSET: copy the channel logo pixel-for-pixel from the reference image. Never redraw, regenerate, or reinterpret logo icons (microphone, book) or wordmark."
    logoUnchanged: |
      TOP RIGHT — logo block (ABSOLUTELY UNTOUCHED — copy verbatim from reference):
      - CRITICAL: Do NOT generate, redraw, reinterpret, restyle, or "fix" ANY part of this logo block
      - Microphone icon + open book + "Speak ENGLISH" + orange "WITH ENERGY" banner — exact same graphics from reference
      - Same size, colors, fonts, and icon shapes as reference — ZERO redesign
    badgeUnchanged: |
      BOTTOM LEFT — keep the green ENGLISH PODCAST badge from the reference (same icon + pill). You may nudge position slightly for layout, but do not invent a new badge or render words like "optional" / "omit".
    shortLogoUnchanged: |
      TOP — logo block ABSOLUTELY UNTOUCHED (copy verbatim from reference):
      - Same wordmark + microphone + book icons as reference — ZERO redesign
    shortBadgeUnchanged: |
      Keep the green ENGLISH PODCAST badge from the reference (same style). Do not invent new badges or meta labels.
    artStyle: "modern clean digital illustration matching the reference exactly — warm soft shading, flat 2D (not photo, not 3D), cozy English-learning podcast look"
    characterColorReference: |
      CHARACTER COLORS — match the reference:
      - Victor sweater: forest green / olive green — NEVER navy, black, or dark blue
      - Lisa sweater: bright orange #FF7A00
    visualGenres: |
      Stay inside the SAME illustration world as the demo. Pick ONE light scene twist (not a new art style):
      - same studio desk, different topic props + host beat
      - bookshelf + whiteboard coaching moment
      - sticky-note brainstorm on the wall behind them
      - checklist / clipboard teaching moment
      - before-vs-after props on the desk (still one continuous illustrated scene — NO split photo panels)
      - coffee-on-desk casual coaching chat
      - notebook practice / role-play moment
      - interview-prep flashcards on the desk
    freshnessRules: |
      SAME STYLE, FRESH EPISODE CONTENT:
      - MUST match the reference art style, character designs, logo, and overall podcast-illustration look
      - CHANGE enough to feel like a new episode: host gestures/interaction, topic props, shelf/wall details, small background accents, optional lighting mood within the same palette family
      - Do NOT change into a different visual genre (no neon cyber, no photoreal, no 3D, no outdoor photography, no split-screen red/green panels)
      - Keep a desk / podcast-host composition similar to the reference (two hosts + headline space)
      - Spell the headline EXACTLY as given; make the typography punchier than plain flat text (see headlineDesign)
    ctrRules: |
      CTR WITHIN THE DEMO STYLE:
      - Clear topic props + readable host reactions at phone-grid size
      - One focal story beat between Victor and Lisa
      - High contrast headline, clean negative space
      - Energetic but still on-brand illustration — not meme faces, not style swaps
    headlineDesign: |
      HEADLINE DESIGN — make the title the #1 click magnet (still on-brand):
      - Huge, ultra-bold condensed sans-serif ALL-CAPS — thicker than body props text
      - High contrast: dark navy #0D1B3D on cream, OR cream/white on a dark navy rounded panel behind the stack
      - Emphasize the HOOK words (usually the quoted phrase, the forbidden phrase, or the emotional punch) in bright orange #FF7A00 — larger or heavier than the surrounding lines
      - Supporting lines stay navy; 1 accent line max in orange (do not rainbow the whole title)
      - Tight line spacing, slight upward energy; leave clear left-side negative space so it reads at phone-grid size
      - Optional tasteful accents ONLY if they help CTR: soft orange underline / brush stroke under the punch line, or a subtle rounded navy plate behind the stack — never messy stickers, never extra words
      - Perfect spelling; crisp edges; no warped letters, no thin fonts, no low-contrast gray text
      - The headline must feel bigger and more intentional than a plain label — like a YouTube thumbnail title, not a caption
    topicRelevance: |
      TOPIC RELEVANCE — REQUIRED:
      - Props, gestures, and wall/shelf details must clearly sell THIS episode's hook
      - AVOID: generic smiles with no topic props, or a scene that could belong to any episode
    expressionModeration: |
      EXPRESSION INTENSITY — clear at thumbnail size, still matching the demo's illustrated faces:
      - Medium expressiveness — specific to the hook
      - NOT flat, NOT clownish, NOT photoreal drama
    charactersExpressionGuidance: |
      Victor — ONE clear illustrated reaction for THIS hook.
      Lisa — ONE clear coaching / contrasting reaction that pairs with Victor.
      Vary the beat; avoid repeating the exact same thumbs-up + point every episode.

