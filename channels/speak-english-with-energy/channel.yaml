    keyword: "#FF7A00"
    ipa: "#2ba6e1"
    background: "#0D1B3D"
  shortSubtitleStyle:
    fontSize: 64
    hookFontSize: 80
    marginV: 260
    lineWidth: 32
    useBox: true
    hookUseBox: true
    boxPadding: 28
    hookBoxPadding: 32
    outline: "#0D1B3D"
    outlineWidth: 8
    shadow: 8
  waveVisualizer:
    y: 200
  thumbnail:
    freshnessMode: fresh-episode
    logoOverlay:
      podcast:
        anchor: bottom-left
        widthRatio: 0.09
        marginRatio: 0.025
      short:
        anchor: bottom-left
        widthRatio: 0.14
        marginRatio: 0.03
      # Circular badge
      logo:
        anchor: bottom-left
        widthRatio: 0.09
        marginRatio: 0.025
      logoShort:
        anchor: bottom-left
        widthRatio: 0.14
        marginRatio: 0.03
      # Vertical wordmark
      wordmark:
        anchor: top-right
        widthRatio: 0.13
        marginRatio: 0.015
      wordmarkShort:
        anchor: top-right
        widthRatio: 0.22
        marginRatio: 0.025
    brandColors: "Dark Navy #0D1B3D, Royal Blue #1E3A8A, Bright Orange #FF7A00, Off-white #F2F4F7"
    charactersBlock: |
      BOTH HOSTS REQUIRED — cute flat CARTOON characters (friendly animated podcast duo):
      - Victor: cartoon man, brown hair, short beard, forest green / olive green sweater (NOT navy/black), black headphones, navy mug labeled "Victor"
      - Lisa: cartoon woman, long wavy brown hair, bright orange #FF7A00 sweater, black headphones, orange mug labeled "Lisa"
      - Simple rounded cartoon faces, big friendly eyes, clean outlines — like a kids' education cartoon or sticker art
      - NEVER photorealistic, NEVER semi-realistic/uncanny-valley faces, NEVER 3D/Pixar, NEVER anime, NEVER creepy detailed skin
    logoLockRules: "LOGO IS COMPOSITED LATER from the official PNG. Never draw, invent, or place any channel logo or wordmark."
    logoUnchanged: |
      Leave BOTTOM LEFT empty for the circular logo composite, and TOP RIGHT empty for the wordmark composite. Do not draw any logo in either corner.
    badgeUnchanged: |
      Optional small cartoon badge OK (e.g. ENGLISH PODCAST pill) — keep simple. No channel logo.
    shortLogoUnchanged: |
      Leave BOTTOM LEFT empty for circular logo and TOP RIGHT empty for wordmark. Do not draw any logo.
    shortBadgeUnchanged: |
      Optional small cartoon badge OK. No channel logo.
    artStyle: "cute flat 2D cartoon / friendly animated illustration — bold clean outlines, simple shapes, soft cel shading, bright cozy colors. NOT photoreal, NOT semi-real, NOT uncanny-valley, NOT 3D render, NOT hyper-detailed faces"
    characterColorReference: |
      CHARACTER COLORS:
      - Victor sweater: forest green / olive green — NEVER navy, black, or dark blue
      - Lisa sweater: bright orange #FF7A00
    visualGenres: |
      Stay in a cute cartoon podcast world. Pick ONE light scene twist:
      - same studio desk, different topic props + host beat
      - bookshelf + whiteboard coaching moment
      - sticky-note brainstorm on the wall behind them
      - checklist / clipboard teaching moment
      - before-vs-after props on the desk (one continuous cartoon scene — NO split panels)
      - coffee-on-desk casual coaching chat
      - notebook practice / role-play moment
      - interview-prep flashcards on the desk
    freshnessRules: |
      CUTE CARTOON, FRESH EPISODE:
      - Keep the same cartoon host designs and cozy podcast look
      - CHANGE gestures, topic props, shelf/wall details per episode
      - Do NOT go photoreal / semi-real / creepy / 3D / neon cyber
      - LEFT ~40%: paint the CTR headline (huge, exact spelling)
      - RIGHT: hosts + conflict props
    ctrRules: |
      MAXIMUM CTR (YouTube phone-grid):
      - Headline must be the first thing you notice — bigger than the hosts
      - ONE clear conflict beat (shock / stop / point at red X) — never matching smiles
      - High contrast navy + cream + orange #FF7A00 only for the punch phrase
      - Props sell the hook in under 1 second (red X, failed checklist)
      - FORBIDDEN: painted channel logo/wordmark (composited later)
      - FORBIDDEN: duplicate episode-title text besides the CTR stack
      - FORBIDDEN: soft/neutral headlines
    headlineDesign: |
      PAINT the CTR headline yourself (exact lines from thumbnailText):
      - Stacked 3–4 lines, ultra-bold condensed ALL-CAPS
      - Dark navy rounded panel behind the stack OR high-contrast cream-on-navy
      - Punch/quoted line in bright orange #FF7A00 + optional thick orange underline
      - Supporting lines cream/white; perfect spelling; no warped letters
      - Leave bottom-left corner clear for circular logo; top-right clear for wordmark
      - Fill ~35–42% of frame width with the headline block — dominant CTR magnet
    topicRelevance: |
      TOPIC RELEVANCE — REQUIRED:
      - Props and gestures must instantly sell THIS episode's forbidden phrase / hook
      - A viewer must "get it" in under 1 second at thumbnail size
      - AVOID: generic smiles, empty desk, props that could belong to any episode
    expressionModeration: |
      EXPRESSION — cute cartoon, HIGH clarity at thumbnail size:
      - One host reacts (shock/worry); the other coaches / corrects
      - Slightly exaggerated cartoon faces OK for CTR
      - NOT creepy, NOT photoreal, NOT blank/dead eyes
    charactersExpressionGuidance: |
      Victor — ONE clear cartoon reaction tied to the mistake/hook (e.g. pointing at WRONG, surprised).
      Lisa — ONE contrasting coaching beat (stop gesture, shake head, "try this instead").
      Never both smiling the same way. Vary the beat every episode.

