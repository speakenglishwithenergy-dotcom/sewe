id: speak-english-with-energy
name: Speak English With Energy
niche: English learning podcast for A2-B1 learners

hosts:
  - name: Victor
    voice: M1
    personality: male, warm, enthusiastic, uses real-life examples, encouraging
  - name: Lisa
    voice: F1
    personality: female, thoughtful, asks insightful questions, relatable, practical

script:
  targetMinWords: 2100
  targetMinLines: 140
  languageLevel: A2-B1
  closingTemplate: "Thanks for listening — see you next time on {channelName}!"
  dialogueRules: |
    - English level: A2-B1 (clear vocabulary, common expressions)
    - Only configured hosts speak — no narrator
    - Natural spoken English — sound like friends on a real podcast, not a scripted interview
    - Each line: 1–2 sentences (~14–20 words per line) — conversational, not one-liners
    - Keep momentum: every line should move the conversation forward
    - Turn-taking is flexible: the same host MAY speak 2–4 consecutive lines when finishing a story
    - When telling a story, let the storyteller finish it across consecutive lines
    - Do NOT end a line with a dangling hook just to hand off the turn
    - Questions should react to what was actually said, not mechanically prompt the next beat
    - Avoid stiff ping-pong Q&A; mix reactions, follow-ups, and back-and-forth naturally
    - Sound human, not AI: use specific details — avoid generic motivational phrases
    - Do NOT include IPA — text only
  dialogueFlowExample: |
    Story flow — BAD (forced hand-off):
    Victor: "Well, I remember a time in school where I spoke up in class, right?"
    Lisa: "And did something happen that made you feel embarrassed?"
    Victor: "Yeah, a few classmates laughed, and it really got to me."

    Story flow — GOOD (storyteller continues naturally):
    Victor: "Well, I remember a time in school where I spoke up in class."
    Victor: "A few classmates laughed, and honestly, it really got to me."
    Lisa: "Oh, that hurts — did it change how you spoke up after that?"
  sectionsOutlineGuidance: |
    Plan sections that feel native to the episode topic — not a generic "main idea 1/2/3" lesson.
    Name each main segment after a concrete angle (a story beat, myth, habit, or question from the topic).
    Briefs should tell Victor and Lisa what to talk about for THIS topic specifically.
  sections:
    - id: intro
      label: Intro & hook
      lineCount: 18
      brief: Warm greeting, introduce the topic, paint a vivid everyday scene listeners recognize, explain why it matters to English learners today, and preview what Victor and Lisa will cover in this episode.
    - id: main1
      label: Main idea 1
      lineCount: 26
      brief: First core angle of the topic — personal story or key concept with concrete details, follow-up questions, and a clear takeaway phrase listeners can reuse.
    - id: main2
      label: Main idea 2
      lineCount: 26
      brief: Second angle — everyday example, misconception, or "what if" moment tied to the topic, with a mini role-play or contrast between weak vs strong English.
    - id: main3
      label: Main idea 3
      lineCount: 26
      brief: Practical tips, one common mistake, and a short listener-style scenario — what to say and what to avoid in real conversations.
    - id: main4
      label: Main idea 4
      lineCount: 26
      brief: Deeper dive — advanced nuance, cultural context, or a second story that reinforces the topic; end with a memorable line listeners can practice out loud.
    - id: closing
      label: Closing
      lineCount: 18
      brief: Recap the episode's main points with examples, land one actionable tip for this week, answer a final "so what now?" beat, warm goodbye — no subscribe CTAs.

short:
  enabled: true
  hookSpeaker: Victor
  bodySpeaker: Lisa
  minLines: 10
  maxLines: 20

