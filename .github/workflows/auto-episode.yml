name: Auto episode (SEWE)

# Schedule: Mon / Wed / Fri 20:00 Asia/Ho_Chi_Minh → production short (~90–120s)
# Manual Run workflow: default mode=test → ~30–60s private short for CI smoke test
# Resume: action=resume restores checkpoint (scripts/audio/subs/thumbs, no mp4) then --resume

on:
  schedule:
    - cron: '0 13 * * 1'
    - cron: '0 13 * * 3'
    - cron: '0 13 * * 5'
  workflow_dispatch:
    inputs:
      action:
        description: 'new = start a new episode. resume = restore checkpoint + continue incomplete batch.'
        type: choice
        options:
          - new
          - resume
        default: new
      mode:
        description: 'test = ~30–60s private short (recommended). short = production short. full = podcast+short.'
        type: choice
        options:
          - test
          - short
          - full
        default: test
      channel:
        description: 'Channel id'
        type: string
        default: speak-english-with-energy
      run_id:
        description: 'Resume only: failed run id to restore checkpoint from (blank = latest workspace artifact)'
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-episode-${{ github.event.inputs.channel || 'speak-english-with-energy' }}
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CHANNEL_ID: ${{ github.event.inputs.channel || 'speak-english-with-energy' }}
      BATCH_ACTION: ${{ github.event.inputs.action || 'new' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      OPENAI_TTS_MODEL: ${{ secrets.OPENAI_TTS_MODEL }}
      IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER }}
      GEMINI_IMAGE_MODEL: ${{ secrets.GEMINI_IMAGE_MODEL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_IMAGE_MODEL: ${{ secrets.CLOUDFLARE_IMAGE_MODEL }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PUBLISH_PRIVACY: ${{ secrets.YOUTUBE_PUBLISH_PRIVACY }}
      YOUTUBE_CATEGORY_ID: ${{ secrets.YOUTUBE_CATEGORY_ID }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PUBLISH_LIVE: ${{ secrets.FACEBOOK_PUBLISH_LIVE }}
      FACEBOOK_FIRST_COMMENT: ${{ secrets.FACEBOOK_FIRST_COMMENT }}
      TIKTOK_PUBLISH_ENABLED: ${{ secrets.TIKTOK_PUBLISH_ENABLED }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
      TIKTOK_PUBLISH_PRIVACY: ${{ secrets.TIKTOK_PUBLISH_PRIVACY }}
      DISABLE_THUMBNAIL_GENERATION: 'false'
      # Free ubuntu-latest: no GPU. ultrafast + skip motion/wave keeps long encodes usable.
      FFMPEG_X264_PRESET: ultrafast
      FFMPEG_DISABLE_MOTION: 'true'
      FFMPEG_SKIP_WAVE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore workspace checkpoint
        if: env.BATCH_ACTION == 'resume'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          set -euo pipefail
          ARTIFACT="workspace-${CHANNEL_ID}"
          RUN_ID="${SOURCE_RUN_ID:-}"

          if [ -z "$RUN_ID" ]; then
            echo "Resolving latest non-expired artifact: $ARTIFACT"
            RUN_ID="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT}&per_page=20" \
              --jq '[.artifacts[] | select(.expired == false)] | .[0].workflow_run.id // empty')"
            if [ -z "$RUN_ID" ]; then
              echo "No checkpoint artifact found for $ARTIFACT" >&2
              exit 1
            fi
          fi

          echo "Restoring $ARTIFACT from run_id=$RUN_ID"
          mkdir -p .checkpoint-restore
          gh run download "$RUN_ID" -n "$ARTIFACT" -D .checkpoint-restore

          if [ -f .checkpoint-restore/projects.tar.gz ]; then
            mkdir -p "output/${CHANNEL_ID}"
            tar -xzf .checkpoint-restore/projects.tar.gz -C "output/${CHANNEL_ID}"
            echo "Restored project files:"
            find "output/${CHANNEL_ID}/projects" -type f | head -80 || true
          else
            echo "Warning: projects.tar.gz missing in checkpoint (scripts/audio may be absent)" >&2
          fi

          if [ -f .checkpoint-restore/topics.json ]; then
            mkdir -p "channels/${CHANNEL_ID}"
            cp .checkpoint-restore/topics.json "channels/${CHANNEL_ID}/topics.json"
            echo "Restored channels/${CHANNEL_ID}/topics.json from checkpoint"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -filters 2>/dev/null | grep -E 'subtitles|ass' || true
          ffmpeg -version | head -1

      - name: Install Git LFS
        run: |
          sudo apt-get install -y git-lfs
          git lfs install

      - name: Cache Supertonic models
        id: cache-supertonic
        uses: actions/cache@v4
        with:
          path: assets/supertonic-3
          key: supertonic-3-v1

      - name: Download Supertonic (Hugging Face)
        if: steps.cache-supertonic.outputs.cache-hit != 'true'
        run: |
          rm -rf assets/supertonic-3
          git clone --depth 1 https://huggingface.co/Supertone/supertonic-3 assets/supertonic-3
          ls -lh assets/supertonic-3/onnx

      - name: Install npm dependencies
        run: npm ci

      - name: Resolve generate mode
        id: mode
        run: |
          # Cron (no inputs) → production short. Manual default → test (~30–60s).
          MODE="${{ github.event.inputs.mode || 'short' }}"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          case "$MODE" in
            test)
              echo "EPISODE_PROFILE=test" >> "$GITHUB_ENV"
              echo "BATCH_GENERATE_FLAGS=--short" >> "$GITHUB_ENV"
              echo "Using TEST profile: ~30–60s short, demo thumbnail (no image API), publish --now, ultrafast encode"
              ;;
            short)
              echo "EPISODE_PROFILE=production" >> "$GITHUB_ENV"
              echo "BATCH_GENERATE_FLAGS=--short" >> "$GITHUB_ENV"
              echo "Using production short (~90–120s), ultrafast encode (no motion/wave on CI)"
              ;;
            full)
              echo "EPISODE_PROFILE=production" >> "$GITHUB_ENV"
              echo "BATCH_GENERATE_FLAGS=" >> "$GITHUB_ENV"
              echo "Using full podcast + short, ultrafast encode (no motion/wave on CI)"
              ;;
            *)
              echo "Unknown mode: $MODE" >&2
              exit 1
              ;;
          esac

      - name: Run auto batch
        run: |
          set -euo pipefail
          if [ "$BATCH_ACTION" = resume ]; then
            echo "Resuming incomplete batch from topics.json + restored workspace"
            npm run batch -- --channel="$CHANNEL_ID" --resume
          else
            # --yes always creates a NEW project (ignores incomplete rows in topics.json)
            echo "Starting new episode (--yes)"
            npm run batch -- --channel="$CHANNEL_ID" --count=1 --yes
          fi

      - name: Commit topics.json if changed
        if: always()
        run: |
          TOPICS="channels/${CHANNEL_ID}/topics.json"
          if git diff --quiet -- "$TOPICS"; then
            echo "No topics.json changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TOPICS"
          git commit -m "chore(${CHANNEL_ID}): update topics.json after auto episode"
          git push

      - name: Pack workspace checkpoint (no video)
        if: always()
        run: |
          set -euo pipefail
          rm -rf .checkpoint
          mkdir -p .checkpoint

          if [ -d "output/${CHANNEL_ID}/projects" ]; then
            # Scripts, audio, subtitles, thumbnails, publish metadata — skip mp4 re-render on resume
            tar -czf .checkpoint/projects.tar.gz \
              --exclude='*.mp4' \
              --exclude='*/video/*' \
              -C "output/${CHANNEL_ID}" projects
            echo "Packed projects.tar.gz ($(du -h .checkpoint/projects.tar.gz | cut -f1))"
          else
            echo "No output/${CHANNEL_ID}/projects — skipping projects.tar.gz"
          fi

          if [ -f "channels/${CHANNEL_ID}/topics.json" ]; then
            cp "channels/${CHANNEL_ID}/topics.json" .checkpoint/topics.json
          fi

          ls -lah .checkpoint

      - name: Upload workspace checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ env.CHANNEL_ID }}
          path: .checkpoint/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 0
